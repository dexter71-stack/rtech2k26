<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeto Gestão — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='10' fill='%231f3d2b'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo-row" id="login-logo"></div>
      <h1>Galeto Gestão</h1>
      <div class="tagline">Gestão operacional da Galeto São Luís</div>

      <form id="login-form" novalidate>
        <div class="alert alert-danger login-error" id="login-error" role="alert"></div>

        <div class="field">
          <label for="identifier">Usuário ou e-mail</label>
          <input class="input" id="identifier" name="identifier" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input class="input" id="password" type="password" name="password" autocomplete="current-password" required />
        </div>

        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Entrar</button>
        <p class="hint" style="margin-top:12px; font-size:11.5px; color:#68756d; text-align:center;">
          Acesso restrito à equipe da Galeto São Luís.<br />Problemas de acesso? Fale com o administrador.
        </p>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/login.js"></script>
</body>
</html>
